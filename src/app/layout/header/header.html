<header class="header">
  <div class="header__container">
    <a
      class="header__logo"
      routerLink="/"
      (click)="irParaTopo()"
      aria-label="Ju Duarte Beauty Studio — início"
    >
      <img
        class="header__logo-img"
        src="/imagens/logo/logo-jd.png"
        alt=""
        width="137"
        height="120"
        fetchpriority="high"
      />
      <span class="header__logo-texto">
        <span class="header__logo-nome">Ju Duarte</span>
        <span class="header__logo-sub">Beauty Studio</span>
      </span>
    </a>

    <nav
      id="menu-principal"
      class="header__nav"
      [class.header__nav--aberto]="menuAberto()"
      aria-label="Seções do site"
    >
      <ul class="header__lista">
        @for (link of links; track link.ancora) {
          <li>
            <a class="header__link" [appRolarPara]="link.ancora" (click)="fecharMenu()">{{
              link.rotulo
            }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="header__acoes">
      <a
        class="header__cta"
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Agendar horário pelo WhatsApp"
      >
        <svg class="header__cta-icone" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 13.9c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"
          />
        </svg>
        <span class="header__cta-texto">Agendar</span>
      </a>

      <button
        class="header__menu-btn"
        type="button"
        (click)="alternarMenu()"
        [attr.aria-expanded]="menuAberto()"
        aria-controls="menu-principal"
        [attr.aria-label]="menuAberto() ? 'Fechar menu' : 'Abrir menu'"
      >
        <span class="header__menu-barra" [class.header__menu-barra--x1]="menuAberto()"></span>
        <span class="header__menu-barra" [class.header__menu-barra--x2]="menuAberto()"></span>
      </button>
    </div>
  </div>
</header>
