<footer class="footer" role="contentinfo">
  <div class="footer__container">
    <a class="footer__logo" href="/" aria-label="Ju Duarte Beauty Studio — início">
      Ju Duarte <span>Beauty Studio</span>
    </a>

    <nav class="footer__links" aria-label="Links do rodapé">
      <a
        [href]="instagramUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="footer__link"
        aria-label="Visitar nosso Instagram"
        >{{ instagramHandle }}</a
      >
      <a
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="footer__link"
        aria-label="Entrar em contato pelo WhatsApp"
        >{{ phone }}</a
      >
    </nav>

    <div class="footer__legal">
      <p>&copy; {{ currentYear }} Ju Duarte Beauty Studio · São Paulo – SP</p>
      <p class="footer__dev">Desenvolvido por <strong>Petrick Amorim</strong></p>
    </div>
  </div>
</footer>
