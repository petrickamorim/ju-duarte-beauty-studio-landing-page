<section class="galeria" id="portfolio" aria-labelledby="galeria-titulo">
  <div class="container">
    <div class="galeria__topo">
      <app-section-header
        eyebrow="Portfólio"
        title="Resultados reais"
        [centered]="false"
        [refinado]="true"
        id="galeria-titulo"
      />

      <div class="galeria__filtros" role="group" aria-label="Filtrar por categoria">
        @for (cat of categorias; track cat) {
          <button
            class="galeria__filtro-btn"
            [class.galeria__filtro-btn--ativo]="categoriaAtiva() === cat"
            (click)="selecionarCategoria(cat)"
            [attr.aria-pressed]="categoriaAtiva() === cat"
            type="button"
          >
            {{ cat }}
          </button>
        }
      </div>
    </div>

    <div class="galeria__grid" role="list" aria-label="Fotos da galeria">
      @for (coluna of colunas(); track $index) {
        <div class="galeria__coluna" role="presentation">
          @for (item of coluna; track item.foto.src) {
            @let foto = item.foto;
            @let i = item.indice;
            <article
              class="galeria__item"
              [class.galeria__item--ativo]="cardAtivo() === i"
              role="listitem"
            >
              <figure
                class="galeria__figura"
                (click)="abrirLightbox(foto, i)"
                (keydown.enter)="abrirLightbox(foto, i)"
                (keydown.space)="abrirLightbox(foto, i)"
                (touchstart)="tocarCard(i)"
                (touchend)="soltarCard()"
                tabindex="0"
                role="button"
                [attr.aria-label]="'Ampliar foto: ' + foto.alt"
              >
                <img
                  [src]="imagemUrl(foto)"
                  [alt]="foto.alt"
                  class="galeria__imagem"
                  loading="lazy"
                  decoding="async"
                  [attr.width]="foto.largura"
                  [attr.height]="foto.altura"
                />
                <figcaption class="galeria__overlay" aria-hidden="true">
                  <span class="galeria__categoria-label">{{ foto.categoria }}</span>
                  <span class="galeria__lupa" aria-hidden="true">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      width="22"
                      height="22"
                    >
                      <circle cx="11" cy="11" r="8" />
                      <line x1="21" y1="21" x2="16.65" y2="16.65" />
                      <line x1="11" y1="8" x2="11" y2="14" />
                      <line x1="8" y1="11" x2="14" y2="11" />
                    </svg>
                  </span>
                </figcaption>
              </figure>
            </article>
          }
        </div>
      }
    </div>

    <div class="galeria__cta">
      <app-whatsapp-button
        [href]="whatsappUrl + '?text=' + whatsappMessage"
        variante="escuro"
        label="Agende seu horário"
        ariaLabel="Agendar horário pelo WhatsApp"
      />
    </div>
  </div>
</section>

@if (lightboxAberto()) {
  <div
    class="galeria__lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Visualizar foto"
    (click)="fecharLightbox()"
  >
    <button
      class="galeria__lightbox-fechar"
      (click)="fecharLightbox()"
      type="button"
      aria-label="Fechar visualização"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        width="20"
        height="20"
        aria-hidden="true"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

    <button
      class="galeria__lightbox-nav galeria__lightbox-nav--prev"
      (click)="$event.stopPropagation(); navegarLightbox(-1)"
      type="button"
      aria-label="Foto anterior"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="22"
        height="22"
        aria-hidden="true"
      >
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>

    <div class="galeria__lightbox-conteudo" (click)="$event.stopPropagation()">
      @if (fotoAtiva(); as foto) {
        <img [src]="foto.src" [alt]="foto.alt" class="galeria__lightbox-imagem" />
        <p class="galeria__lightbox-legenda">
          <span class="galeria__lightbox-legenda-cat">{{ foto.categoria }}</span>
          {{ foto.alt }}
        </p>
      }
    </div>

    <button
      class="galeria__lightbox-nav galeria__lightbox-nav--next"
      (click)="$event.stopPropagation(); navegarLightbox(1)"
      type="button"
      aria-label="Próxima foto"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="22"
        height="22"
        aria-hidden="true"
      >
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </button>
  </div>
}
