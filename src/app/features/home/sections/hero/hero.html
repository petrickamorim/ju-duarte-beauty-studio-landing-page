<section class="hero" id="inicio" aria-labelledby="hero-titulo">
  <!-- Conteúdo editorial -->
  <div class="hero__content">
    <p class="hero__eyebrow">Studio de beleza · São Paulo</p>

    <h1 class="hero__headline" id="hero-titulo">
      Beleza sofisticada para mulheres que valorizam <em>elegância</em>.
    </h1>

    <p class="hero__subheadline">
      Maquiagem, penteado e unhas com atendimento personalizado, no studio ou a domicílio.
    </p>

    <div class="hero__ctas">
      <app-whatsapp-button
        [href]="whatsappUrl"
        variante="escuro"
        label="Agendar pelo WhatsApp"
        ariaLabel="Agendar horário no Ju Duarte Beauty Studio pelo WhatsApp"
      />
      <a class="hero__btn-secundario" appRolarPara="servicos">Ver serviços</a>
    </div>

    <a class="hero__avaliacao" appRolarPara="avaliacoes">
      <span class="hero__estrelas" role="img" [attr.aria-label]="'Nota ' + googleNota + ' de 5'"
        >★★★★★</span
      >
      <span
        ><strong>{{ googleNota }}</strong> · {{ googleTotal }} avaliações no Google</span
      >
    </a>
  </div>

  <!-- Foto -->
  <figure class="hero__figure">
    <img
      class="hero__image"
      src="/imagens/hero/hero.jpeg"
      alt="Cliente com maquiagem e penteado feitos no Ju Duarte Beauty Studio"
      width="1400"
      height="1867"
      fetchpriority="high"
    />
  </figure>
</section>
