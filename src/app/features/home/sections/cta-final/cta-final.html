<section class="cta-final" id="contato" aria-labelledby="cta-final-titulo">
  <div class="container">
    <div class="cta-final__conteudo">
      <p class="cta-final__eyebrow">Agenda aberta</p>
      <h2 class="cta-final__titulo" id="cta-final-titulo">
        Pronta para se sentir <em>incrível</em>?
      </h2>
      <p class="cta-final__subtitulo">
        Fale com a Júlia pelo WhatsApp e reserve seu horário. Resposta geralmente em minutos.
      </p>

      <div class="cta-final__acoes">
        <app-whatsapp-button
          [href]="whatsappMessage"
          variante="contraste"
          label="Agendar meu horário"
          ariaLabel="Agendar horário pelo WhatsApp"
        />
        <a
          class="cta-final__maps-btn"
          [href]="mapsUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Ver como chegar ao studio no Google Maps"
        >
          <app-icone nome="pin" [tamanho]="18" />
          Como chegar
        </a>
      </div>

      <address class="cta-final__endereco">
        <app-icone class="cta-final__endereco-icone" nome="pin" [tamanho]="16" />
        {{ endereco }}
      </address>

      <p class="cta-final__selos">
        Sem taxas extras <span aria-hidden="true">·</span> Atendimento personalizado
        <span aria-hidden="true">·</span> Parcelamento em até 3x
      </p>
    </div>
  </div>
</section>
